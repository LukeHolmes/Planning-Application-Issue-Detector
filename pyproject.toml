[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-detector"
version = "0.1.0"
description = "ML pipeline to flag problematic Irish planning applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luke Holmes" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.28", "matplotlib>=3.7", "seaborn>=0.13"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.scripts]
planning-train = "planning_detector.cli:train_main"
planning-predict = "planning_detector.cli:predict_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
